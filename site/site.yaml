# The site's shape. Pages under `pages` are hand-designed templates; each
# collection publishes a docs/ directory as-is, so the site follows the repo.
# The site is for people new to Bearing: it describes the finished product,
# so it publishes the spec but not the decision records in docs/adr.
title: Bearing
tagline: Get your bearings in any engineering org.
description: >-
  Bearing answers everyday questions about an engineering organization, such
  as who owns this and what changed, from the tools it already uses, and
  shows where every answer came from.
repo: dhm116/bearing
branch: main
# Logo files are copied from here, never redrawn.
brand: docs/brand

nav:
  - { label: How it works, href: how-it-works/ }
  - { label: Roadmap, href: roadmap/ }
  - { label: Spec, href: spec/ }

pages:
  - template: home
    path: ""
    title: Bearing
    description: >-
      Who owns this, who can help and what changed: one place to ask, with
      the source of every answer.
  - template: how
    path: how-it-works/
    title: How it works
    description: >-
      Bearing reads your tools, notes what each one says, connects the dots
      and answers questions with its sources.
  - template: roadmap
    path: roadmap/
    title: Roadmap
    description: >-
      What Bearing can do today, what is being built now and what is
      planned.
  - template: "404"
    path: 404/
    title: Page not found
    description: This page doesn't exist.

collections:
  - id: spec
    title: Specification
    short: Spec
    description: The data model, adapter protocol and component contracts.
    dir: docs/spec
    path: spec
    order: [data-model.md, adapter-protocol.md, contracts.md]
