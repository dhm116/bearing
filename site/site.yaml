# The site's shape. Pages under `pages` are hand-designed templates; each
# collection publishes a docs/ directory as-is, so the site follows the repo.
# The site is for people new to Bearing: it describes the finished product,
# so it publishes the spec and the guides in docs/, but not the decision
# records in docs/adr.
title: Bearing
tagline: Get your bearings in any engineering org.
description: >-
  Bearing answers everyday questions about an engineering organization, such
  as who owns this and what changed, from the tools it already uses, and
  shows where every answer came from.
repo: dhm116/bearing
branch: main
# Logo files are copied from here, never redrawn.
brand: docs/brand

nav:
  - { label: How it works, href: how-it-works/ }
  - { label: Roadmap, href: roadmap/ }
  - { label: Spec, href: spec/ }
  - { label: Guides, href: guides/ }

pages:
  - template: home
    path: ""
    title: Bearing
    description: >-
      Who owns this, who can help and what changed: one place to ask, with
      the source of every answer.
  - template: how
    path: how-it-works/
    title: How it works
    description: >-
      Bearing reads your tools, notes what each one says, connects the dots
      and answers questions with its sources.
  - template: roadmap
    path: roadmap/
    title: Roadmap
    description: >-
      What Bearing can do today, what is being built now and what is
      planned.
  - template: "404"
    path: 404/
    title: Page not found
    description: This page doesn't exist.

collections:
  - id: spec
    title: Specification
    short: Spec
    description: How facts are recorded, and the server API.
    dir: docs/spec
    path: spec
    order: [concepts.md, api.md]
  - id: guides
    title: Guides
    short: Guides
    description: How Bearing works inside, how to run it, and what it reports about itself.
    dir: docs
    path: guides
    order: [architecture.md, demo.md, mcp.md, telemetry.md]
    exclude: [review-process.md, edge-cases.md, identity-evaluation.md]
  # The rest of docs/: for people building Bearing, not using it.
  - id: contributing
    title: Contributing
    short: Contributing
    description: How Bearing is built, tested and reviewed, for people working on it.
    dir: docs
    path: contributing
    order: [review-process.md, edge-cases.md, identity-evaluation.md]
    exclude: [architecture.md, demo.md, mcp.md, telemetry.md]
  - id: security
    title: Security
    short: Security
    description: What Bearing protects, from whom, and how.
    dir: docs/security
    path: security
  - id: brand
    title: Brand
    short: Brand
    description: The Bearing logo, colors and type.
    dir: docs/brand
    path: brand
