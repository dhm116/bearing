# Features shown on the roadmap page, written for someone who has never
# heard of Bearing: say what a person can do, not how it is built.
#
# The page shows each feature as available, in progress or planned, and
# nothing else. It never shows milestones or issue numbers; they are only
# how a status is worked out:
#   - a `status` here wins (available, in-progress or planned). Use it for
#     work GitHub doesn't track: things that already work, or ideas with no
#     milestone yet.
#   - with `issues`: all closed is available; some closed, or its milestone
#     is active, is in progress; otherwise planned.
#   - with only a `milestone`: a closed milestone is available, an active
#     one is in progress, otherwise planned.
# A milestone is active when it is the first open one, or when any of its
# issues are closed.

# GitHub milestone numbers, in the order the work happens.
milestones:
  - number: 1 # Guardrails
  - number: 2 # Data model
  - number: 3 # Walking skeleton
  - number: 4 # Durable, always-on core
  - number: 5 # Sandboxed connectors
  - number: 6 # Configuration from files
  - number: 7 # Semantic search
  - number: 8 # First complete release

areas:
  - name: Connect your tools
    summary: Bearing reads the tools your organization already uses. It never changes them.
  - name: Answers you can check
    summary: Plain answers to everyday questions, each showing where it came from.
  - name: Ask from anywhere
    summary: The same answers wherever you work.
  - name: Safe and dependable
    summary: Careful with your data, and honest about what it did.
  - name: Run it your way
    summary: Open source, built from parts you can swap.

features:
  # Connect your tools
  - name: GitHub
    area: Connect your tools
    summary: Repositories, teams, people, and the files that say who must approve changes to the code.
    status: available
  - name: Company directory
    area: Connect your tools
    summary: People and groups from a directory such as Authentik, so someone's GitHub account and work account are known to be the same person.
    milestone: 8
  - name: Write a connector for any tool
    area: Connect your tools
    summary: A published guide and protocol for connecting a tool Bearing doesn't support yet.
    milestone: 5
    links:
      - { label: Connector protocol, href: spec/adapter-protocol/ }
  - name: AWS
    area: Connect your tools
    summary: Cloud accounts and resources, the tags that say who they belong to, and who changed what.
    status: planned
  - name: PagerDuty
    area: Connect your tools
    summary: Who is on call right now, who to call next, and recent incidents.
    status: planned
  - name: Backstage
    area: Connect your tools
    summary: Bring in an existing Backstage service catalog instead of starting over.
    status: planned

  # Answers you can check
  - name: Who owns this?
    area: Answers you can check
    summary: Ask who owns a repository or service and get a straight answer with the evidence behind it.
    milestone: 3
  - name: One record per person, team and service
    area: Answers you can check
    summary: Recognizes the same person or team across tools, and can undo a match that turns out to be wrong.
    milestone: 3
  - name: Sources on every answer
    area: Answers you can check
    summary: Every answer says which tool it came from, when that tool last confirmed it and how sure Bearing is.
    milestone: 3
    links:
      - { label: How facts are recorded, href: spec/data-model/ }
  - name: Disagreements shown, not hidden
    area: Answers you can check
    summary: When two tools disagree, Bearing shows both answers instead of quietly picking one.
    milestone: 3
  - name: Look back in time
    area: Answers you can check
    summary: See who owned what on a given day, and everything that changed since.
    milestone: 4
  - name: Search in plain words
    area: Answers you can check
    summary: Find things by what they mean, not only by their exact names, without sending your data to an outside AI service.
    milestone: 7

  # Ask from anywhere
  - name: Command line
    area: Ask from anywhere
    summary: Ask questions from the terminal, where many engineers already work.
    milestone: 3
  - name: Try a connector from the command line
    area: Ask from anywhere
    summary: Run a connector against your own tools and see exactly what it reports, before anything is stored.
    status: available
  - name: AI coding assistants
    area: Ask from anywhere
    summary: Coding assistants get the same answers through MCP, the common way assistants connect to tools, so they know who owns the code they change.
    milestone: 8
  - name: Web browser
    area: Ask from anywhere
    summary: Browse people, teams, services and recent changes in a browser.
    status: planned
  - name: Approved actions
    area: Ask from anywhere
    summary: Ask Bearing to carry out routine tasks, such as rolling back a release, with the right approvals and a record of who did what.
    status: planned

  # Safe and dependable
  - name: Read-only connectors
    area: Safe and dependable
    summary: Connectors only read from your tools. They never change anything in them.
    status: available
  - name: Sealed-off connectors
    area: Safe and dependable
    summary: Each connector runs in a sandbox, reaches only what it was allowed to, and never sees a password or token.
    milestone: 5
  - name: Nothing gets lost
    area: Safe and dependable
    summary: Every update from your tools is saved before it is used, so the whole picture can be rebuilt at any time.
    milestone: 4
  - name: Tamper-evident record
    area: Safe and dependable
    summary: Every change Bearing makes is written down with who or what made it, and any later tampering shows.
    milestone: 4
  - name: Genuine updates only
    area: Safe and dependable
    summary: Updates that your tools send are checked to be genuine before they are stored.
    milestone: 4
  - name: Public threat model
    area: Safe and dependable
    summary: A written list of what could go wrong and how Bearing guards against each risk.
    issues: [12]
  - name: Built-in monitoring
    area: Safe and dependable
    summary: Logs, traces and metrics in OpenTelemetry, the open standard most monitoring tools understand.
    status: available

  # Run it your way
  - name: Open source
    area: Run it your way
    summary: Free to use, change and share under the Apache 2.0 license.
    status: available
  - name: An open specification
    area: Run it your way
    summary: How Bearing records facts and talks to connectors is written down, so anyone can build on it.
    issues: [13, 11]
    links:
      - { label: Read the spec, href: spec/ }
  - name: Swap any part
    area: Run it your way
    summary: Each part sits behind a published interface with tests, so you can replace the database, or any other part, with your own.
    status: available
    links:
      - { label: Component contracts, href: spec/contracts/ }
  - name: One database to start
    area: Run it your way
    summary: SurrealDB holds both the facts and the search index, as a separate server or built into Bearing.
    status: available
  - name: Settings in files
    area: Run it your way
    summary: Describe your connectors in files you can review like code, and preview every change before it applies.
    milestone: 6
  - name: Try it in one command
    area: Run it your way
    summary: Start Bearing with a sample company already loaded, to see it work before connecting your own tools.
    milestone: 8
