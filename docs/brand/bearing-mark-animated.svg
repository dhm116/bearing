<svg class="bearing-anim" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bearing logo animation: a compass needle searches, spins, and hands its momentum to the stem of a lowercase b" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root,.bearing-anim{--ink:#18242A;--acc:#1D5E74}@media (prefers-color-scheme:dark){:root,.bearing-anim{--ink:#E4ECEA;--acc:#7FC0D6}}@keyframes b-needle{0.000%{transform:rotate(40deg)}7.432%{transform:rotate(40deg);animation-timing-function:cubic-bezier(.3,1.35,.5,1)}12.162%{transform:rotate(-70deg);animation-timing-function:cubic-bezier(.3,1.35,.5,1)}18.243%{transform:rotate(150deg);animation-timing-function:cubic-bezier(.3,1.35,.5,1)}22.297%{transform:rotate(95deg);animation-timing-function:cubic-bezier(.3,1.35,.5,1)}28.378%{transform:rotate(250deg);animation-timing-function:cubic-bezier(.3,1.35,.5,1)}32.432%{transform:rotate(205deg)}34.459%{transform:rotate(205deg);animation-timing-function:cubic-bezier(.6,0,1,.55)}68.919%{transform:rotate(1805deg)}100.000%{transform:rotate(1805deg)}}@keyframes b-hub{0.000%{transform:translate(32px,32px)}61.486%{transform:translate(32px,32px);animation-timing-function:cubic-bezier(.45,0,.2,1)}72.973%{transform:translate(34px,42px)}100.000%{transform:translate(34px,42px)}}@keyframes b-ring{0.000%{transform:scale(1);stroke-width:5px}61.486%{transform:scale(1);stroke-width:5px;animation-timing-function:cubic-bezier(.45,0,.2,1)}72.973%{transform:scale(0.5769);stroke-width:11.27px}100.000%{transform:scale(0.5769);stroke-width:11.27px}}@keyframes b-dot{0.000%{transform:scale(1)}61.486%{transform:scale(1);animation-timing-function:cubic-bezier(.45,0,.2,1)}72.973%{transform:scale(.8)}100.000%{transform:scale(.8)}}@keyframes b-len{0.000%{transform:scaleY(1)}61.486%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,.8,.4)}68.919%{transform:scaleY(0)}100.000%{transform:scaleY(0)}}@keyframes b-notch{0.000%{transform:rotate(0deg)}63.514%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.4,0,.85,.6)}76.351%{transform:rotate(270deg)}100.000%{transform:rotate(270deg)}}@keyframes b-nlen{0.000%{transform:scaleY(1)}63.514%{transform:scaleY(1);animation-timing-function:cubic-bezier(.75,0,1,.35)}76.351%{transform:scaleY(0)}100.000%{transform:scaleY(0)}}@keyframes b-stem{0.000%{transform:scaleY(0)}74.324%{transform:scaleY(0);animation-timing-function:cubic-bezier(.25,1.35,.45,1)}81.081%{transform:scaleY(1)}100.000%{transform:scaleY(1)}}@keyframes b-arc{0.000%{opacity:1}6.757%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.2,1)}10.811%{opacity:0}100.000%{opacity:0}}@keyframes b-blur{0.000%{opacity:0}43.243%{opacity:0;animation-timing-function:cubic-bezier(.5,0,1,1)}64.865%{opacity:.18;animation-timing-function:cubic-bezier(.45,0,.2,1)}70.270%{opacity:0}100.000%{opacity:0}}@keyframes b-arrow{0.000%{transform:scale(0)}79.730%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.6,.5,1)}85.811%{transform:scale(1)}100.000%{transform:scale(1)}}.bearing-anim .needle{animation:b-needle 7.4s linear both}.bearing-anim .hub{animation:b-hub 7.4s linear both}.bearing-anim .ring{animation:b-ring 7.4s linear both}.bearing-anim .dot{animation:b-dot 7.4s linear both}.bearing-anim .len{animation:b-len 7.4s linear both}.bearing-anim .notch{animation:b-notch 7.4s linear both}.bearing-anim .nlen{animation:b-nlen 7.4s linear both}.bearing-anim .stem{animation:b-stem 7.4s linear both}.bearing-anim .arc{animation:b-arc 7.4s linear both}.bearing-anim .blur{animation:b-blur 7.4s linear both}.bearing-anim .arrow{animation:b-arrow 7.4s linear both}.bearing-anim .ringc,.bearing-anim .notchl,.bearing-anim .steml{fill:none;stroke:var(--ink)}.bearing-anim .dotc,.bearing-anim .arrowp{fill:var(--acc)}.bearing-anim .arcp,.bearing-anim .blurc{fill:none;stroke:var(--acc)}.bearing-anim .needlel{stroke:var(--acc);stroke-linecap:round}.bearing-anim .nlen{transform-origin:0 -26px}.bearing-anim .stem{transform-origin:19px 42px}.bearing-anim .arrow{transform-origin:19px 21px}@media (prefers-reduced-motion:reduce){.bearing-anim *{animation-duration:1ms!important;animation-delay:0s!important}}</style><g class="arc"><path class="arcp" d="M32 18.5 A13.5 13.5 0 0 1 40.68 21.66" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 4"/></g>
