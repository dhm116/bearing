<svg viewBox="0 0 960 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr13-concepts-dark-title adr13-concepts-dark-desc" id="adr13-concepts-dark-root">
<title id="adr13-concepts-dark-title">From observation to answer</title>
<desc id="adr13-concepts-dark-desc">An adapter publishes its own namespace's terms to the vocabulary modules, which core maintainers, adapters and the operator each own, and sends observations in those terms to ingest. Mappings and rules turn adapter terms into core meaning: broader for kinds, exact_match for relations and attributes, and derives rules that make facts. Ingest logs observations and writes facts that cite the observation and, when a rule made them, its rule and version; answers show that evidence.</desc>
