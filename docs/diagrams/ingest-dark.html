<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside an ingest</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #11191C;
      --color-ink:    #E4ECEA;
      --color-muted:  #98A8AD;
      --color-accent: #7FC0D6;
      --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · How Bearing works inside</p>
    <h1>Inside an ingest</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingest-dark-title ingest-dark-desc">
<title id="ingest-dark-title">Inside an ingest</title>
<desc id="ingest-dark-desc">Flowchart of one ingest: an observation already seen is skipped; otherwise it is logged, its record is found or created, linked IDs become asserted same_as links when the source vouches for them and proposed links when it does not, facts are opened, refreshed or closed, and clusters are recomputed from asserted links.</desc>

<rect width="100%" height="100%" fill="#11191C"/>

<rect x="140" y="464" width="200" height="56" rx="6" fill="#11191C"/><rect x="140" y="464" width="200" height="56" rx="6" fill="rgba(228,236,234,0.02)" stroke="rgba(228,236,234,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="240" y="490" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Proposed link</text><text x="240" y="505" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">same_as · joins nothing yet</text>
<rect x="560" y="264" width="240" height="56" rx="6" fill="#11191C"/><rect x="560" y="264" width="240" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="680" y="290" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Open, refresh or close facts</text><text x="680" y="305" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">relations, attributes, qualifiers</text>
<rect x="560" y="464" width="240" height="56" rx="6" fill="#11191C"/><rect x="560" y="464" width="240" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="680" y="490" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Recompute clusters</text><text x="680" y="505" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">records joined by asserted links</text>
</g>
<!-- legend -->
<line x1="40" y1="548" x2="920" y2="548" stroke="rgba(228,236,234,0.10)" stroke-width="0.8"/><text x="40" y="576" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text><rect x="112" y="568" width="14" height="10" rx="2" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="132" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Step</text><polygon points="187,567 194,573 187,579 180,573" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="200" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Decision</text><rect x="268" y="568" width="20" height="10" rx="5" fill="rgba(228,236,234,0.03)" stroke="rgba(228,236,234,0.30)" stroke-width="1"/><text x="294" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">End</text><rect x="338" y="568" width="14" height="10" rx="2" fill="rgba(127,192,214,0.10)" stroke="#7FC0D6" stroke-width="1"/><text x="358" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Joins records</text><rect x="450" y="568" width="14" height="10" rx="2" fill="rgba(228,236,234,0.02)" stroke="rgba(228,236,234,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="470" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Waits for a person or rule</text>
