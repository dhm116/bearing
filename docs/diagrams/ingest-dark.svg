<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingest-dark-title ingest-dark-desc" id="ingest-dark-root">
<title id="ingest-dark-title">Inside an ingest</title>
<desc id="ingest-dark-desc">Flowchart of one ingest: an observation already seen is skipped; otherwise it is logged, its record is found or created, linked IDs become asserted same_as links when the source vouches for them and proposed links when it does not, facts are opened, refreshed or closed, and clusters are recomputed from asserted links.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      #ingest-dark-root { --color-paper:  #11191C;
      --color-ink:    #E4ECEA;
      --color-muted:  #98A8AD;
      --color-accent: #7FC0D6;
      --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, Menlo, monospace; }
      #ingest-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ingest-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #ingest-dark-root .diagram-container { overflow-x: visible; }</style><marker id="ingest-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#98A8AD"/></marker><marker id="ingest-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7FC0D6"/></marker><marker id="ingest-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A4A9E3"/></marker><marker id="ingest-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#98A8AD" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#11191C"/>
<g>
<!-- zones -->
<!-- arrows -->
<circle cx="240" cy="36" r="4" fill="#E4ECEA"/>
<path d="M 240,40 L 240,72" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 312,112 L 368,112" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 240,152 L 240,184" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 240,232 L 240,264" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 240,320 L 240,352" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 340,292 L 560,292" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 320,392 L 424,392" fill="none" stroke="#7FC0D6" stroke-width="1.4" marker-end="url(#ingest-dark-arrow-accent)"/>
<path d="M 240,432 L 240,464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 720,320 L 720,464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<path d="M 584,392 H 632 Q 640,392 640,400 V 464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#ingest-dark-arrow)"/>
<!-- labels -->
<rect x="248" y="44" width="72" height="12" rx="2" fill="#11191C"/><text x="284" y="53" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVATION</text>
<rect x="326" y="92" width="28" height="12" rx="2" fill="#11191C"/><text x="340" y="101" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="248" y="156" width="24" height="12" rx="2" fill="#11191C"/><text x="260" y="165" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="328" y="372" width="88" height="12" rx="2" fill="#11191C"/><text x="372" y="381" fill="#7FC0D6" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SOURCE VOUCHES</text>
<rect x="248" y="436" width="72" height="12" rx="2" fill="#11191C"/><text x="284" y="445" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NOT VOUCHED</text>
<!-- nodes -->
<polygon points="240,72 312,112 240,152 168,112" fill="#11191C"/><polygon points="240,72 312,112 240,152 168,112" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="240" y="116" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Seen this ID?</text>
<rect x="368" y="92" width="120" height="40" rx="20" fill="#11191C"/><rect x="368" y="92" width="120" height="40" rx="20" fill="#e4ecea" fill-opacity="0.03" stroke="#e4ecea" stroke-opacity="0.30" stroke-width="1"/><text x="428" y="116" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Skip it</text>
<rect x="140" y="184" width="200" height="48" rx="6" fill="#11191C"/><rect x="140" y="184" width="200" height="48" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="240" y="206" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Log it</text><text x="240" y="221" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">in the observation table</text>
<rect x="140" y="264" width="200" height="56" rx="6" fill="#11191C"/><rect x="140" y="264" width="200" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="240" y="290" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Find or create the record</text><text x="240" y="305" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">by key and aliases</text>
<polygon points="240,352 320,392 240,432 160,392" fill="#11191C"/><polygon points="240,352 320,392 240,432 160,392" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="240" y="396" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Linked IDs?</text>
<rect x="424" y="364" width="160" height="56" rx="6" fill="#11191C"/><rect x="424" y="364" width="160" height="56" rx="6" fill="#7fc0d6" fill-opacity="0.10" stroke="#7FC0D6" stroke-width="1"/><text x="504" y="390" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Asserted link</text><text x="504" y="405" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">same_as</text>
<rect x="140" y="464" width="200" height="56" rx="6" fill="#11191C"/><rect x="140" y="464" width="200" height="56" rx="6" fill="#e4ecea" fill-opacity="0.02" stroke="#e4ecea" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="240" y="490" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Proposed link</text><text x="240" y="505" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">same_as · joins nothing yet</text>
<rect x="560" y="264" width="240" height="56" rx="6" fill="#11191C"/><rect x="560" y="264" width="240" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="680" y="290" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Open, refresh or close facts</text><text x="680" y="305" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">relations, attributes, qualifiers</text>
<rect x="560" y="464" width="240" height="56" rx="6" fill="#11191C"/><rect x="560" y="464" width="240" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="680" y="490" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Recompute clusters</text><text x="680" y="505" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">records joined by asserted links</text>
</g>
<!-- legend -->
<line x1="40" y1="548" x2="920" y2="548" stroke="#e4ecea" stroke-opacity="0.10" stroke-width="0.8"/><text x="40" y="576" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text><rect x="112" y="568" width="14" height="10" rx="2" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="132" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Step</text><polygon points="187,567 194,573 187,579 180,573" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="200" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Decision</text><rect x="268" y="568" width="20" height="10" rx="5" fill="#e4ecea" fill-opacity="0.03" stroke="#e4ecea" stroke-opacity="0.30" stroke-width="1"/><text x="294" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">End</text><rect x="338" y="568" width="14" height="10" rx="2" fill="#7fc0d6" fill-opacity="0.10" stroke="#7FC0D6" stroke-width="1"/><text x="358" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Joins records</text><rect x="450" y="568" width="14" height="10" rx="2" fill="#e4ecea" fill-opacity="0.02" stroke="#e4ecea" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="470" y="576" fill="#98A8AD" font-size="8.5" font-family="'IBM Plex Sans', system-ui, sans-serif">Waits for a person or rule</text>
</svg>
