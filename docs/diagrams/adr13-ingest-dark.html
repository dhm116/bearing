<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside an ingest</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #11191C;
      --color-ink:    #E4ECEA;
      --color-muted:  #98A8AD;
      --color-accent: #7FC0D6;
      --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', 'Noto Sans KR', 'Noto Sans TC', system-ui, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Accepted · ADR 13</p>
    <h1>Inside an ingest</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr13-ingest-dark-title adr13-ingest-dark-desc">
<title id="adr13-ingest-dark-title">Inside an ingest</title>
<desc id="adr13-ingest-dark-desc">Flowchart of one ingest. An observation already seen is skipped; otherwise it is logged and its record found or created. Inside the same transaction, derive rules run over it: a new fact opens with the observation's source and cites rule and version, a new rule version that makes the same fact adds a source without closing it, and a fact no rule makes any more closes. A later complete sync from the source also closes rule-made facts whose subject is gone.</desc>

<rect width="100%" height="100%" fill="#11191C"/>
<g>

<path d="M 152,320 L 152,352" fill="none" stroke="#7FC0D6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 264,370 H 304 Q 312,370 312,362 V 292 Q 312,284 320,284 H 464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 264,388 H 464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 264,406 H 304 Q 312,406 312,414 V 484 Q 312,492 320,492 H 464" fill="none" stroke="#98A8AD" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="240" y="92" width="24" height="12" rx="2" fill="#11191C"/><text x="252" y="101" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="162" y="162" width="20" height="12" rx="2" fill="#11191C"/><text x="172" y="171" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="367" y="262" width="50" height="12" rx="2" fill="#11191C"/><text x="392" y="271" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NEW FACT</text>
<rect x="359" y="366" width="66" height="12" rx="2" fill="#11191C"/><text x="392" y="375" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NEW VERSION</text>
<rect x="356" y="470" width="72" height="12" rx="2" fill="#11191C"/><text x="392" y="479" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">RULE STOPPED</text>
<rect x="696" y="470" width="72" height="12" rx="2" fill="#11191C"/><text x="732" y="479" fill="#98A8AD" font-size="8" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SUBJECT GONE</text>

<rect x="40" y="184" width="224" height="48" rx="6" fill="#11191C"/><rect x="40" y="184" width="224" height="48" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="152" y="206" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Log it</text><text x="152" y="221" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">in the observation table</text>
<rect x="40" y="264" width="224" height="56" rx="6" fill="#11191C"/><rect x="40" y="264" width="224" height="56" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="152" y="290" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Find or create the record</text><text x="152" y="305" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">by key and aliases, then links</text>
<rect x="40" y="352" width="224" height="72" rx="6" fill="#11191C"/><rect x="40" y="352" width="224" height="72" rx="6" fill="rgba(127,192,214,0.10)" stroke="#7FC0D6" stroke-width="1"/><text x="152" y="379" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Run derive rules</text><text x="152" y="394" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">key is a template over the fields</text><text x="152" y="408" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">no key, no fact</text>
<rect x="464" y="248" width="224" height="72" rx="6" fill="#11191C"/><rect x="464" y="248" width="224" height="72" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="576" y="275" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Open the fact</text><text x="576" y="290" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">keeps the observation's source</text><text x="576" y="304" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">cites rule@version</text>
<rect x="464" y="352" width="224" height="72" rx="6" fill="#11191C"/><rect x="464" y="352" width="224" height="72" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="576" y="379" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Add a source, stay open</text><text x="576" y="394" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">new rule version, same fact</text><text x="576" y="408" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">no close and reopen</text>
<rect x="464" y="456" width="224" height="72" rx="6" fill="#11191C"/><rect x="464" y="456" width="224" height="72" rx="6" fill="#172226" stroke="#E4ECEA" stroke-width="1"/><text x="576" y="483" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Close the fact</text><text x="576" y="498" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">rule stopped making it,</text><text x="576" y="512" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">or its subject is gone</text>
<rect x="776" y="456" width="152" height="72" rx="6" fill="#11191C"/><rect x="776" y="456" width="152" height="72" rx="6" fill="rgba(152,168,173,0.10)" stroke="#7C8F94" stroke-width="1"/><rect x="784" y="462" width="36" height="12" rx="2" fill="none" stroke="rgba(228,236,234,0.22)" stroke-width="0.8"/><text x="802" y="471" fill="#7C8F94" font-size="7" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">LATER</text><text x="852" y="489" fill="#E4ECEA" font-size="12" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Next complete sync</text><text x="852" y="504" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">snapshot or audit log</text><text x="852" y="518" fill="#98A8AD" font-size="9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" text-anchor="middle">shows the subject gone</text>
