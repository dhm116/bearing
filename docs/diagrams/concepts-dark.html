<desc id="concepts-dark-desc">An adapter sends observations to Store.Ingest, which writes four kinds of table: observations, facts with their sources, records with their keys, and identity links; asserted same_as links join records into entities, each fact points back at the observations behind it, and queries from the CLI, API and MCP read facts and entities.</desc>
