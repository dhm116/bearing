<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 96 1280 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-extension-dark-title server-extension-dark-desc" id="server-extension-dark-root">
<title id="server-extension-dark-title">Where new parts plug in</title>
<desc id="server-extension-dark-desc">The two seams where Bearing grows: the AdapterService gRPC contract (Describe, Sync, Handle), which today's GitHub, Authentik and Kubernetes adapters speak and later AWS, PagerDuty and Backstage adapters, sandboxed or remote, will speak too; and the store interface, which DuckDB implements today and Quack or DuckLake could implement for more than one writer. Clients ask the server through the API: the CLI, REST and MCP over stdio today, and an HTTP MCP endpoint, GraphQL and OIDC later.</desc>
