    <h1>How the trail decides a broken step</h1>

<title id="adr13-trail-decider-title">How the trail decides a broken step</title>
<desc id="adr13-trail-decider-desc">Rules make per-step proposed facts and the joiner joins them. A step whose handle names no observed record is a break. For a break a System One model picks one on-call service or none, then scores the pick on three levels; the rounded score routes the step to join (the trail joins, with the model's p scaling the step), review (the break stays for a person) or none (no link). A joined link is a proposed fact a person confirms.</desc>
