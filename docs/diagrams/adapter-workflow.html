<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adapter workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5F7F6;
      --color-ink:    #18242A;
      --color-muted:  #55646B;
      --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', system-ui, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    svg .m { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
    svg .s { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    svg .name { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #18242A; }
    svg .sub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; fill: #55646B; }
    svg .tag { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 7px; fill: #6B7C82; letter-spacing: 0.08em; }
    svg .lbl { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 8px; fill: #55646B; letter-spacing: 0.06em; }
    svg .lane { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 8px; font-weight: 500; fill: #55646B; letter-spacing: 0.18em; }
    svg .rk { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; fill: #6B7C82; }
    svg .rv { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; fill: #18242A; }
    svg .rn { fill: #55646B; }
    svg .note { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; font-style: italic; fill: #18242A; }
    svg .leg { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 8.5px; fill: #55646B; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · ADR 12, proposed</p>
    <h1>Starting an adapter from an OpenAPI spec</h1>

<title id="adapter-workflow-title">Starting an adapter from an OpenAPI spec</title>
<desc id="adapter-workflow-desc">An author starts a mapping from an OpenAPI spec with bearing adapter init and edits it; the generic OpenAPI adapter runs the mapping, optionally with the author's Go middleware; bearing adapter check and sync test it against a mock API, and the passing adapter is installed in Bearing's settings, where the server runs it and stores namespaced records whose meaning comes from the operator's extends.</desc>

<rect x="1072" y="300" width="152" height="56" rx="6" fill="#F5F7F6"/><rect x="1072" y="300" width="152" height="56" rx="6" fill="#FFFFFF" stroke="#18242A" stroke-width="1"/><rect x="1080" y="306" width="24" height="12" rx="2" fill="none" stroke="rgba(24,36,42,0.22)" stroke-width="0.8"/><text x="1092" y="315" class="tag" text-anchor="middle">CLI</text><text x="1148" y="334" class="name" text-anchor="middle">Check and test</text><text x="1148" y="348" class="sub" text-anchor="middle">adapter check · sync</text>
