# Path-to-reviewer map (see docs/review-process.md). Each name maps to the
# agent .claude/agents/<name>-reviewer.md.
#
# Each PR gets up to three expert reviewers, chosen by the paths it touches,
# plus the ponytail reviewer. If `security` matches, it always takes a slot.
# `go` reviews any Go change no domain expert covers. A PR that matches no
# rule gets `default`.
#
# Globs follow CODEOWNERS syntax: "*" matches within one path segment, "**"
# across segments, and a trailing "/" matches everything under a directory.
# Unlike CODEOWNERS, every matching rule counts, not just the last one.
#
# Some paths do not exist yet; they are listed so routing is settled before
# the code lands.

default: spec

reviewers:
  security:
    # Everything that accepts data or requests from outside the process.
    - "**/ingest/"
    - "**/*ingest*.go"
    - "**/*webhook*.go"
    - "**/api/"
    - "**/mcp/"
    - "**/*mcp*.go"
    - "pkg/adapter/"
    - "adapters/"
    # Secrets, config and deployment.
    - "**/*secret*.go"
    - "**/config/"
    - "**/compose*.y*ml"
    - "deploy/"
    - "**/Dockerfile*"
    - ".github/workflows/"
    - "go.mod"
    - "go.sum"

  data:
    # The data model, resolution, the store and queries over facts.
    - "proto/"
    - "pkg/model/"
    - "**/resolver/"
    - "**/*resolve*.go"
    - "**/store/"
    - "**/duck*/"
    - "pkg/query/"
    - "testdata/observations/"
    - "docs/adr/0002-*"
    - "docs/adr/0005-*"

  spec:
    # Wire shapes, every surface users or agents call, and design docs.
    - "proto/"
    - "gen/go/"
    - "cmd/"
    - "**/api/"
    - "**/mcp/"
    - "**/*mcp*.go"
    - "**/config/"
    - "docs/"
    - "AGENTS.md"
    - "ROADMAP.md"
    - "README.md"
    - "CONTRIBUTING.md"
    - ".github/reviewers.yml"
    - ".claude/"

  go:
    - "**/*.go"
    - "go.mod"
    - "go.sum"
    - "Makefile"
