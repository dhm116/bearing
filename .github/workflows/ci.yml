name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run of the last one pointless.
# Pushes to main each keep their own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `make check` runs everything below in one process. Here it is split into
# jobs that run side by side, so a push is answered in the time of the
# slowest of static, race and the longest test shard, plus the gate. The
# tests, and the same tests at the merge base, are what take the time, so
# each runs in the shards the Makefile names (SHARDS), one runner apiece.
#
# Each job keeps its own module and build cache, because each builds
# different things (tools and lint, cover builds, race builds). setup-go's
# cache would be one entry for all of them, saved once by whichever job ended
# first and never refreshed. A push to main saves a fresh one per job; pull
# requests restore main's latest and save nothing. baseline restores test's:
# both are cover builds, and main's is the merge base's.
jobs:
  # Everything that needs no test run.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-static-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-static-

      - run: make static

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' || github.head_ref == 'ci/cache-per-job'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # The tests of the pull request's merge commit, with coverage, in the shards
  # the Makefile names. A shard that is missing from this list leaves a
  # profile missing, and the check job fails on that.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-test-

      - run: make cover SHARD=${{ matrix.shard }} COVER_OUT=cover-${{ matrix.shard }}.out

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' || github.head_ref == 'ci/cache-per-job'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-head-${{ matrix.shard }}
          path: cover-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 1
          # "Re-run all jobs" uploads into the same run again.
          overwrite: true

  # The packages that take locks or run goroutines, under the race detector.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-race-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-race-

      - run: make race

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' || github.head_ref == 'ci/cache-per-job'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # The same tests, in the same shards, at the merge base with main, for the
  # gate's comparison of total coverage. They don't wait for the test job:
  # both run at once on different runners. A push to main has no merge base to
  # measure.
  baseline:
    name: baseline (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate needs history back to the merge base with the pull
          # request's base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-test-

      # Writes baseline/base-<shard>.out, or nothing when the gate would skip
      # (only documentation changed). The marker keeps the artifact from
      # being empty either way.
      - run: |
          mkdir baseline
          make covergate-base SHARD=${{ matrix.shard }} BASE_PROFILE=baseline/base-${{ matrix.shard }}.out
          echo measured > baseline/done-${{ matrix.shard }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-base-${{ matrix.shard }}
          path: baseline/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The coverage gate, and the one check a branch rule needs: it fails unless
  # the other jobs passed.
  check:
    needs: [static, test, baseline, race]
    # Runs after a failure or a cancellation too, to report it as this check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the other jobs
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
          RACE: ${{ needs.race.result }}
        run: |
          echo "static: $STATIC, test: $TEST, baseline: $BASELINE, race: $RACE"
          [ "$STATIC" = success ] && [ "$TEST" = success ] && [ "$RACE" = success ] && { [ "$BASELINE" = success ] || [ "$BASELINE" = skipped ]; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No module cache: covergate imports only the standard library.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cover-head-*
          merge-multiple: true
          path: cover

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.baseline.result == 'success'
        with:
          pattern: cover-base-*
          merge-multiple: true
          path: baseline

      # The profiles to merge are the Makefile's SHARDS, not whatever was
      # downloaded: a shard that did not run leaves a file missing, and the
      # gate fails on it. Without a baseline (a push to main) there is no
      # merge base to compare with, and the gate skips; when it chose not to
      # measure one (only documentation changed), it skips before it reads a
      # profile.
      - name: Compare coverage with the merge base
        env:
          BASELINE: ${{ needs.baseline.result }}
        run: |
          head=$(make -s shard-profiles DIR=cover PREFIX=cover-)
          base=
          if [ "$BASELINE" = success ]; then
            base=$(make -s shard-profiles DIR=baseline PREFIX=base-)
          fi
          echo "head profiles: $head; baseline profiles: ${base:-none}"
          make covergate-report COVER_OUT="$head" BASE_PROFILE="$base"
