name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run of the last one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # internal/surrealstore and pkg/store run their SurrealDB suites against
  # the container the .github/actions/surrealdb action starts. The root
  # credentials only guard a throwaway in-memory database on the runner, and
  # the suites use them to provision a database-scoped user per test database
  # and then run as that user (C-STORE-2).
  BEARING_TEST_SURREALDB: ws://127.0.0.1:8000
  BEARING_TEST_SURREALDB_USER: root
  BEARING_TEST_SURREALDB_PASS: root
  BEARING_TEST_SURREALDB_SCOPED: "1"

# `make check` runs everything below in one process. Here it is split into
# jobs that run side by side, so a push is answered in the time of the
# slowest of static, test and baseline, plus the gate; the tests, and the
# same tests at the merge base, are what take the time.
jobs:
  # Everything that needs no test run.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - run: make static

  # The tests of the pull request's merge commit, with coverage.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: ./.github/actions/surrealdb

      - run: make cover

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-head
          path: cover.out
          retention-days: 1

  # The same tests at the merge base with main, for the gate's comparison of
  # total coverage. It doesn't wait for the test job: the two run at once on
  # different runners. A push to main has no merge base to measure.
  baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate needs history back to the merge base with the pull
          # request's base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: ./.github/actions/surrealdb

      # Writes baseline/base.out, or nothing when the gate would skip (only
      # documentation changed). The marker keeps the artifact from being
      # empty either way.
      - run: |
          mkdir baseline
          make covergate-base BASE_PROFILE=baseline/base.out
          echo measured > baseline/done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-base
          path: baseline/
          if-no-files-found: error
          retention-days: 1

  # The coverage gate, and the one check a branch rule needs: it fails unless
  # the other jobs passed.
  check:
    needs: [static, test, baseline]
    # Runs after a failure too, to report it as this check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the other jobs
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: |
          echo "static: $STATIC, test: $TEST, baseline: $BASELINE"
          [ "$STATIC" = success ] && [ "$TEST" = success ] && { [ "$BASELINE" = success ] || [ "$BASELINE" = skipped ]; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cover-head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.baseline.result == 'success'
        with:
          name: cover-base
          path: baseline

      # Without a baseline (a push to main) there is no merge base to
      # compare with, and the gate skips.
      - run: make covergate-report BASE_PROFILE=baseline/base.out
