name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run of the last one pointless.
# Pushes to main each keep their own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # internal/pgstore and pkg/store run against the server the
  # .github/actions/postgres action starts. The administrator's password
  # guards a throwaway server on the runner; the suites provision a role
  # without administrator rights and a schema per test, and run as that role
  # (C-STORE-2).
  BEARING_TEST_POSTGRES: postgres://postgres@127.0.0.1:5432/postgres
  BEARING_TEST_POSTGRES_PASSWORD: postgres
  BEARING_TEST_POSTGRES_SCOPED: "1"

# `make check` runs everything below in one process. Here it is split into
# jobs that run side by side, so a push is answered in the time of the
# slowest of static, test and baseline, plus the gate; the tests, and the
# same tests at the merge base, are what take the time.
jobs:
  # Everything that needs no test run.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - run: make static

  # The tests of the pull request's merge commit, with coverage.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: ./.github/actions/postgres

      - run: make cover

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-head
          path: cover.out
          if-no-files-found: error
          retention-days: 1
          # "Re-run all jobs" uploads into the same run again.
          overwrite: true

  # The same tests at the merge base with main, for the gate's comparison
  # of total coverage. They don't wait for the test job: both run at once on
  # different runners. A push to main has no merge base to
  # measure.
  baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate needs history back to the merge base with the pull
          # request's base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: ./.github/actions/postgres

      # Writes baseline/base.out, or nothing when the gate would skip
      # (only documentation changed). The marker keeps the artifact from
      # being empty either way.
      - run: |
          mkdir baseline
          make covergate-base BASE_PROFILE=baseline/base.out
          echo measured > baseline/done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-base
          path: baseline/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The coverage gate, and the one check a branch rule needs: it fails unless
  # the other jobs passed.
  check:
    needs: [static, test, baseline]
    # Runs after a failure or a cancellation too, to report it as this check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the other jobs
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: |
          echo "static: $STATIC, test: $TEST, baseline: $BASELINE"
          [ "$STATIC" = success ] && [ "$TEST" = success ] && { [ "$BASELINE" = success ] || [ "$BASELINE" = skipped ]; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No module cache: covergate imports only the standard library.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cover-head
          path: cover

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.baseline.result == 'success'
        with:
          name: cover-base
          path: baseline

      # Without a baseline (a push to main) there is no merge base to
      # compare with, and the gate skips.
      - name: Compare coverage with the merge base
        run: |
          [ -f cover/cover.out ] || { echo "no head profile"; exit 1; }
          base=
          [ ! -f baseline/base.out ] || base=baseline/base.out
          echo "head profile: cover/cover.out; baseline profile: ${base:-none}"
          make covergate-report COVER_OUT=cover/cover.out BASE_PROFILE="$base"
