name: pgstore-diag

# TEMPORARY: measures why internal/pgstore takes 238 s on the runner.
# Deleted before the pull request merges.
on:
  push:
    branches: [claude/ci-pgstore-time-42i8z6]
    paths: [.github/workflows/pgstore-diag.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BEARING_TEST_POSTGRES: postgres://postgres@127.0.0.1:5432/postgres
  BEARING_TEST_POSTGRES_PASSWORD: postgres
  BEARING_TEST_POSTGRES_SCOPED: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: ./.github/actions/postgres

      - name: Compile
        run: go test -c -o /tmp/plain.test ./internal/pgstore/

      - name: Measure
        working-directory: internal/pgstore
        run: |
          cpu() { docker exec postgres cat /sys/fs/cgroup/cpu.stat | awk '/usage_usec/ {printf "%.1f", $2/1e6}'; }
          fam() {
            name=$1; re=$2
            b=$(cpu); TIMEFORMAT="%R %U %S"
            t=$( { time /tmp/plain.test -test.count=1 -test.run "$re" -test.timeout 15m >/dev/null 2>&1; } 2>&1 )
            a=$(cpu)
            echo "RESULT $name wall/user/sys=$t pgcpu=$(echo "$a - $b" | bc)"
          }
          echo "--- published port (as in CI today)"
          fam whole '.'
          fam random 'TestRandom'
          fam random-histories 'TestRandomHistories'
          fam random-wide 'TestRandomWide'
          fam failpoint 'TestKilling|TestDurabilityChild'
          fam failpoint-any 'TestKillingTheWorkerAtAnyApplyFailpoint|TestDurabilityChild'
          fam failpoint-random 'TestKillingTheWorkerAtRandomMoments|TestDurabilityChild'
          fam graphconf 'TestPostgresGraphConformance'
          fam otherconf 'TestPostgresAuditLogConformance|TestPostgresAuditRetentionConformance|TestPostgresEventLogConformance'
          fam replay 'TestReplaying'
          fam vectors 'TestPostgresVectorConformance|TestVector|TestUpsert|TestPayloads|TestFiltered|TestOpeningTheVector|TestParsingPgvector|TestEveryVector|TestSearch|TestEqualScores'
          echo "--- host network"
          docker rm -f postgres
          docker run --detach --name postgres --network host \
            --tmpfs /var/lib/postgresql/data:rw \
            --env POSTGRES_PASSWORD="$BEARING_TEST_POSTGRES_PASSWORD" \
            --env PGDATA=/var/lib/postgresql/data/pgdata \
            pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a \
            postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200 -c listen_addresses=127.0.0.1
          for i in $(seq 60); do docker exec postgres pg_isready --host 127.0.0.1 --username postgres && break; sleep 1; done
          fam whole-host-network '.'
          fam random-host-network 'TestRandom'
