name: Start PostgreSQL
description: >-
  Starts the PostgreSQL server (with pgvector) the tests of internal/pgstore
  and pkg/store run against, at 127.0.0.1:5432. The administrator's password
  is BEARING_TEST_POSTGRES_PASSWORD from the job's environment.

runs:
  using: composite
  steps:
    # A step rather than a `services:` container so that the data directory
    # can sit in memory: the suites make and drop thousands of tables, and
    # nothing here needs to survive. fsync and full-page writes are off for
    # the same reason; the server is thrown away with the runner.
    - name: Start PostgreSQL
      shell: bash
      run: |
        docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
          --tmpfs /var/lib/postgresql/data:rw \
          --env POSTGRES_PASSWORD="$BEARING_TEST_POSTGRES_PASSWORD" \
          --env PGDATA=/var/lib/postgresql/data/pgdata \
          pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a \
          postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
        for i in $(seq 60); do
          docker exec postgres pg_isready --host 127.0.0.1 --username postgres && exit 0
          sleep 1
        done
        docker logs postgres
        exit 1
