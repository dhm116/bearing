// Configuration resources: the typed, versioned objects an operator applies,
// in the apiVersion/kind/metadata/spec shape: Source and EntityKind, which the
// server's settings file embeds. Resources hold secret references, never
// secret values.

syntax = "proto3";

package bearing.config.v1alpha1;

import "bearing/model/v1alpha1/enums.proto";
import "google/protobuf/struct.proto";

option go_package = "bearing.example/gen/go/bearing/config/v1alpha1;configv1alpha1";

// Metadata identifies a resource.
message Metadata {
  // Unique among resources of one kind: lowercase letters, digits, "-" and
  // "_". Required.
  string name = 1;
  // Free-form labels for selecting and grouping.
  map<string, string> labels = 2;
}

// Source is one configured instance of an adapter, the unit of provenance.
message Source {
  // "bearing/v1alpha1".
  string api_version = 1;
  // "Source".
  string kind = 2;
  // The source's name, for example "github-acme". It may not be "manual"
  // or start with "core/".
  Metadata metadata = 3;
  // The source.
  SourceSpec spec = 4;
}

// SourceSpec is a Source's content.
message SourceSpec {
  reserved 2, 3, 4, 5, 9;
  reserved "namespace", "issues", "links", "authority", "capabilities";

  // The adapter it runs, by name from the settings' adapters. Required.
  string adapter = 1;
  // Its settings, checked against the adapter's declared settings.
  google.protobuf.Struct settings = 6;
  // Secret references by the name of the environment variable the adapter
  // reads the secret from (the key, such as GITHUB_TOKEN or
  // AWS_SECRET_ACCESS_KEY): "env:NAME". Never values.
  map<string, string> secrets = 7;
  // Time between scheduled syncs, an ISO 8601 duration such as "PT1H".
  // Empty: webhooks and manual syncs only.
  string schedule = 8;
  // Secret reference, in the form secrets accepts, for the key the source
  // signs its webhook deliveries with. It is separate from secrets because
  // only the host reads it: an adapter never asks for it or receives it.
  // Empty: the source cannot push events, and its webhooks are refused once
  // the server runs. Ignored when the adapter declares no webhook.
  string webhook_secret = 10;
}

// EntityKind adds a kind to the vocabulary beside the core kinds (ADR 10).
// Configured kinds only grow: a stored kind's parent and its attributes' and
// relations' shapes never change, and a kind dropped from config is retired,
// not deleted.
message EntityKind {
  // "bearing/v1alpha1".
  string api_version = 1;
  // "EntityKind".
  string kind = 2;
  // The resource's name, for example "k8s-service".
  Metadata metadata = 3;
  // The kind.
  EntityKindSpec spec = 4;
}

// EntityKindSpec is an EntityKind's content.
message EntityKindSpec {
  // The kind, "<namespace>.<Kind>" such as "k8s.Service". The namespace names
  // the vocabulary that defines the kind; "bearing" is reserved. Required.
  string name = 1;
  // The parent kind, core or configured, such as "Component". Empty: none,
  // so the kind answers Get, Related, Find and Changes but none of the MVP
  // questions.
  string extends = 2;
  // Attributes a record of this kind may carry.
  repeated AttributeSpec attributes = 3;
  // Relations a record of this kind may have, with this kind in their domain.
  repeated RelationSpec relations = 4;
}

// AttributeSpec declares one attribute. A name has one shape across the whole
// vocabulary, so an attribute that already exists must repeat its shape.
message AttributeSpec {
  // Lowercase letters, digits and "_". Required.
  string name = 1;
  // Required.
  bearing.model.v1alpha1.ValueType type = 2;
  // Required.
  bearing.model.v1alpha1.Cardinality cardinality = 3;
  // Required.
  bearing.model.v1alpha1.ConflictPolicy conflict = 4;
}

// RelationSpec declares one relation predicate. A predicate that already
// exists must repeat its shape; its domain and range grow by these kinds.
message RelationSpec {
  // Lowercase letters, digits and "_". Required.
  string name = 1;
  // Kinds whose records may be the subject, besides the EntityKind itself.
  repeated string domain = 2;
  // Kinds whose records may be the object. Required.
  repeated string range = 3;
  // Required.
  bearing.model.v1alpha1.Cardinality cardinality = 4;
  // Required.
  bearing.model.v1alpha1.ConflictPolicy conflict = 5;
}
