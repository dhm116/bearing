// Configuration resources: the typed, versioned objects an operator applies,
// in the apiVersion/kind/metadata/spec shape. Today there is one, Source,
// which the server's settings file embeds. Resources hold secret references,
// never secret values.

syntax = "proto3";

package bearing.config.v1alpha1;

import "google/protobuf/struct.proto";

option go_package = "bearing.example/gen/go/bearing/config/v1alpha1;configv1alpha1";

// Metadata identifies a resource.
message Metadata {
  // Unique among resources of one kind: lowercase letters, digits, "-" and
  // "_". Required.
  string name = 1;
  // Free-form labels for selecting and grouping.
  map<string, string> labels = 2;
}

// Source is one configured instance of an adapter, the unit of provenance.
message Source {
  // "bearing/v1alpha1".
  string api_version = 1;
  // "Source".
  string kind = 2;
  // The source's name, for example "github-acme". It may not be "manual"
  // or start with "core/".
  Metadata metadata = 3;
  // The source.
  SourceSpec spec = 4;
}

// SourceSpec is a Source's content.
message SourceSpec {
  reserved 2, 3, 4, 5, 9;
  reserved "namespace", "issues", "links", "authority", "capabilities";

  // The adapter it runs, by name from the settings' adapters. Required.
  string adapter = 1;
  // Its settings, checked against the adapter's declared settings.
  google.protobuf.Struct settings = 6;
  // Secret references by the name of the environment variable the adapter
  // reads the secret from (the key, such as GITHUB_TOKEN or
  // AWS_SECRET_ACCESS_KEY): "env:NAME". Never values.
  map<string, string> secrets = 7;
  // Time between scheduled syncs, an ISO 8601 duration such as "PT1H".
  // Empty: webhooks and manual syncs only.
  string schedule = 8;
  // Secret reference, in the form secrets accepts, for the key the source
  // signs its webhook deliveries with. It is separate from secrets because
  // only the host reads it: an adapter never asks for it or receives it.
  // Empty: the source cannot push events, and its webhooks are refused once
  // the server runs. Ignored when the adapter declares no webhook.
  string webhook_secret = 10;
}
