// The core-closed lists of the data model (docs/spec/data-model.md, "Wire
// mapping"). On the wire and in configuration they are written as their
// ProtoJSON names (FACT_STATUS_ASSERTED); prose and fact_id use the short
// form (asserted). A zero *_UNSPECIFIED value means the field's stated
// default and is rejected only where the field is required.

syntax = "proto3";

package bearing.model.v1alpha1;

option go_package = "bearing.example/gen/go/bearing/model/v1alpha1;modelv1alpha1";

// SubjectStatus says whether a subject is live or was merged into another.
enum SubjectStatus {
  // Not set. Required wherever a subject is reported.
  SUBJECT_STATUS_UNSPECIFIED = 0;
  // The subject stands on its own.
  SUBJECT_STATUS_ACTIVE = 1;
  // The subject was merged; merged_into names the survivor.
  SUBJECT_STATUS_MERGED = 2;
}

// MintRule is why the core minted a subject.
enum MintRule {
  // Not set. Required on every mint.
  MINT_RULE_UNSPECIFIED = 0;
  // Resolution rule 3: an observed entity matched no subject.
  MINT_RULE_OBSERVATION = 1;
  // A reference to an unbound alias, or a released name that doesn't redirect.
  MINT_RULE_REFERENCE = 2;
  // An un-merge whose aliases never had a subject of their own.
  MINT_RULE_SPLIT = 3;
}

// MergeRule is why two subjects merged.
enum MergeRule {
  // Not set. Required on every merge.
  MERGE_RULE_UNSPECIFIED = 0;
  // One observation carried id aliases bound to both subjects.
  MERGE_RULE_CO_REPORTED_IDS = 1;
  // An observed binding covered a placeholder's tentative binding.
  MERGE_RULE_PLACEHOLDER = 2;
  // Live authoritative identity evidence joined them.
  MERGE_RULE_AUTHORITATIVE = 3;
  // same_as confidence reached the kind's threshold under the score policy.
  MERGE_RULE_SCORE = 4;
  // A MergeRequested event.
  MERGE_RULE_MANUAL = 5;
}

// KeyClass says whether a key type is a permanent id or a renamable name.
enum KeyClass {
  // Not set. Required in every key type declaration.
  KEY_CLASS_UNSPECIFIED = 0;
  // Assigned once, never changed or reassigned.
  KEY_CLASS_ID = 1;
  // Can be renamed and later reused.
  KEY_CLASS_NAME = 2;
}

// PerSubject limits how many names of one key type a subject holds.
enum PerSubject {
  // Not set: same as PER_SUBJECT_MANY.
  PER_SUBJECT_UNSPECIFIED = 0;
  // Binding a new name of this type to a subject releases its previous one.
  PER_SUBJECT_ONE = 1;
  // A subject may hold several names of this type at once.
  PER_SUBJECT_MANY = 2;
}

// KeyCase is how external IDs of a key type are compared.
enum KeyCase {
  // Not set: same as KEY_CASE_SENSITIVE.
  KEY_CASE_UNSPECIFIED = 0;
  // Compared byte for byte.
  KEY_CASE_SENSITIVE = 1;
  // Compared and stored after Unicode simple case folding.
  KEY_CASE_INSENSITIVE = 2;
}

// MergePolicy decides, per kind, when same_as is asserted and subjects merge.
enum MergePolicy {
  // Not set. Required in configuration.
  MERGE_POLICY_UNSPECIFIED = 0;
  // Live authoritative evidence or a person's confirmation.
  MERGE_POLICY_AUTHORITATIVE = 1;
  // As authoritative, or same_as confidence at or above the policy threshold.
  MERGE_POLICY_SCORE = 2;
  // Only MergeRequested.
  MERGE_POLICY_MANUAL = 3;
}

// MatchMethod is how a field's values count as identity evidence.
enum MatchMethod {
  // Not set: the field is not identity evidence.
  MATCH_METHOD_UNSPECIFIED = 0;
  // Equal canonical values.
  MATCH_METHOD_EXACT = 1;
  // Equal after Unicode simple case folding of the whole address.
  MATCH_METHOD_EMAIL = 2;
  // Equal after NFKC, case folding and whitespace collapsing.
  MATCH_METHOD_NAME = 3;
  // Overlap of member sets.
  MATCH_METHOD_MEMBERS = 4;
}

// Direction says which end of a fact the observed entity is.
enum Direction {
  // Not set: same as DIRECTION_OUT where a default is stated; rejected in
  // snapshot scopes.
  DIRECTION_UNSPECIFIED = 0;
  // The entity is the subject.
  DIRECTION_OUT = 1;
  // The entity is the object.
  DIRECTION_IN = 2;
}

// Cardinality is how many objects one source supports at once.
enum Cardinality {
  // Not set. Required for unregistered attributes.
  CARDINALITY_UNSPECIFIED = 0;
  // At each valid time a source supports at most one object.
  CARDINALITY_ONE = 1;
  // Any number of objects.
  CARDINALITY_MANY = 2;
}

// ConflictPolicy is when supports from different source systems conflict.
enum ConflictPolicy {
  // Not set. Required in the predicate registry.
  CONFLICT_POLICY_UNSPECIFIED = 0;
  // Never.
  CONFLICT_POLICY_NONE = 1;
  // More than one object passes status steps 1 to 5.
  CONFLICT_POLICY_ONE = 2;
  // Two systems have non-empty, different sets of objects.
  CONFLICT_POLICY_SET = 3;
}

// ValueType is the type of an attribute value.
enum ValueType {
  // Not set. Required wherever a typed value appears.
  VALUE_TYPE_UNSPECIFIED = 0;
  // UTF-8 as given, compared byte for byte.
  VALUE_TYPE_STRING = 1;
  // IEEE 754 double; -0 becomes 0; NaN and infinities rejected.
  VALUE_TYPE_FLOAT = 2;
  // true or false.
  VALUE_TYPE_BOOL = 3;
  // UTC with exactly 6 fraction digits, as a string.
  VALUE_TYPE_TIME = 4;
  // Any JSON value, canonical as RFC 8785 (JCS).
  VALUE_TYPE_JSON = 5;
}

// SupportReason is why a support version was written.
enum SupportReason {
  // Not set. Required on every support version.
  SUPPORT_REASON_UNSPECIFIED = 0;
  // An asserting claim.
  SUPPORT_REASON_ASSERT = 1;
  // An ending claim (absent).
  SUPPORT_REASON_END = 2;
  // A snapshot scope's watermark.
  SUPPORT_REASON_SNAPSHOT = 3;
  // entity.deleted or a derived deletion.
  SUPPORT_REASON_DELETED = 4;
  // A ClaimWithdrawn event.
  SUPPORT_REASON_WITHDRAWN = 5;
  // A merge re-pointed the support.
  SUPPORT_REASON_MERGE = 6;
  // An un-merge re-pointed the support.
  SUPPORT_REASON_UNMERGE = 7;
  // A derivation rule re-evaluated the support.
  SUPPORT_REASON_DERIVED = 8;
}

// FactStatus is a fact's status at a valid and record time.
enum FactStatus {
  // Not set. Required in every result.
  FACT_STATUS_UNSPECIFIED = 0;
  // No live supports.
  FACT_STATUS_NONE = 1;
  // Usable in answers that act.
  FACT_STATUS_ASSERTED = 2;
  // Supported, but not asserted.
  FACT_STATUS_CANDIDATE = 3;
  // In a standing conflict.
  FACT_STATUS_CONFLICTED = 4;
  // A manual override covers it and doesn't list it.
  FACT_STATUS_OVERRIDDEN = 5;
}

// StatusReason is which status step decided a fact's status.
enum StatusReason {
  // Not set. Required in every result.
  STATUS_REASON_UNSPECIFIED = 0;
  // Step 7: nothing else applied.
  STATUS_REASON_NONE = 1;
  // Step 1: no live supports.
  STATUS_REASON_NO_SUPPORT = 2;
  // Step 2: a manual override.
  STATUS_REASON_OVERRIDE = 3;
  // Step 3: confidence below the threshold.
  STATUS_REASON_BELOW_THRESHOLD = 4;
  // Steps 4a, 4c and 6c: a conflict stands.
  STATUS_REASON_CONFLICT = 5;
  // Step 4b: a set distinct_from.
  STATUS_REASON_DISTINCT_FROM = 6;
  // Step 4d: the kind's merge policy doesn't accept it.
  STATUS_REASON_MERGE_POLICY = 7;
  // Step 5: the object has no live exists support.
  STATUS_REASON_UNOBSERVED_OBJECT = 8;
  // Step 6a: configured precedence decided.
  STATUS_REASON_PRECEDENCE = 9;
  // Step 6b: authority decided.
  STATUS_REASON_AUTHORITY = 10;
}

// ConflictResolution is the rule that decided a disagreement.
enum ConflictResolution {
  // Not set: the conflict stands.
  CONFLICT_RESOLUTION_UNSPECIFIED = 0;
  // A manual override.
  CONFLICT_RESOLUTION_OVERRIDE = 1;
  // Configured precedence.
  CONFLICT_RESOLUTION_PRECEDENCE = 2;
  // Authority.
  CONFLICT_RESOLUTION_AUTHORITY = 3;
  // The supports stopped disagreeing.
  CONFLICT_RESOLUTION_EVIDENCE_CHANGED = 4;
}

// CompactionDetail is the level of detail an answer comes from.
enum CompactionDetail {
  // Not set. Required in every precision.
  COMPACTION_DETAIL_UNSPECIFIED = 0;
  // Every support version.
  COMPACTION_DETAIL_FULL = 1;
  // A summary per UTC calendar quarter.
  COMPACTION_DETAIL_QUARTER = 2;
  // A summary per UTC calendar year.
  COMPACTION_DETAIL_YEAR = 3;
}

// IssueType is a kind of data-quality issue.
enum IssueType {
  // Not set. Required in every issue.
  ISSUE_TYPE_UNSPECIFIED = 0;
  // An object referenced by live relation supports has no live exists support.
  ISSUE_TYPE_UNOBSERVED_OBJECT = 1;
  // A same_as the merge guard excludes.
  ISSUE_TYPE_ID_CONFLICT = 2;
}

// RejectionCode says why part of an event was rejected.
enum RejectionCode {
  // Not set. Required in every rejection.
  REJECTION_CODE_UNSPECIFIED = 0;
  // An id alias is bound to a subject of another kind.
  REJECTION_CODE_KIND_MISMATCH = 1;
  // Ids bound to subjects with a set distinct_from, or a blocked merge.
  REJECTION_CODE_IDENTITY_CONFLICT = 2;
  // A kind, predicate, key type or link not in the registry or declarations.
  REJECTION_CODE_NOT_DECLARED = 3;
  // A key in a namespace the source neither reads, issues nor links.
  REJECTION_CODE_NAMESPACE_NOT_ALLOWED = 4;
  // observed_at more than 5 minutes after ingest.
  REJECTION_CODE_OBSERVED_AT_IN_FUTURE = 5;
  // A fact claimed twice in disagreeing ways in one observation.
  REJECTION_CODE_DUPLICATE_CLAIM = 6;
  // An array for a predicate of cardinality one.
  REJECTION_CODE_CARDINALITY_MISMATCH = 7;
  // A claim outside its predicate's domain or range.
  REJECTION_CODE_DOMAIN_MISMATCH = 8;
  // A value of the wrong type.
  REJECTION_CODE_TYPE_MISMATCH = 9;
  // An adapter claimed same_as or distinct_from.
  REJECTION_CODE_CORE_PREDICATE = 10;
  // A non-canonical or out-of-range value.
  REJECTION_CODE_INVALID_VALUE = 11;
  // valid_to at or before valid_from.
  REJECTION_CODE_INVALID_INTERVAL = 12;
  // DistinctFromSet for two subjects already merged.
  REJECTION_CODE_ALREADY_MERGED = 13;
  // A manual operation its rules don't allow.
  REJECTION_CODE_INVALID_OPERATION = 14;
  // A required field is missing or not well formed (an unparsable key, a
  // missing entity). The spec's list has no code for structural errors.
  REJECTION_CODE_MALFORMED = 15;
  // A ChangeSet over the store's count limits even after the resolver
  // compacted what it could (contracts.CheckChangeSetLimits).
  REJECTION_CODE_TOO_LARGE = 16;
}
