// The resolver's own state: what it must remember between events to give
// the same valid-time answers whatever order events are applied in
// (docs/spec/data-model.md, "Ordering and idempotency"). Each message is the
// value of one ChangeSet.state entry, packed in an Any, and is written in
// the same ChangeSet as the rows it describes. Stores keep the entries and
// read them back; they never look inside (docs/spec/contracts.md, "State
// keys"). These messages are not part of the data model.
//
// Every message below is rewritten whole by each apply that touches it. A
// re-observation that says what the entry already says (a confirmation) does
// not add a record: it moves the existing record's ordering key to its own, the
// "last verified" key, so BindingWrites and SupportSegments grow with the
// changes a source reports, not with its syncs. A write whose key falls
// between a record's first and last confirmations is ignored when it is applied
// after the last (docs/spec/data-model.md, "State, determinism and apply").
// The one record a sync still adds is the watermark of its scope. A late
// claim can fall between any two syncs, so every watermark is kept, but in
// small entries of their own, not in one that is rewritten whole: a scope's
// journal grows by the size of a watermark per sync, not by the size of all
// of them (issue #136).

syntax = "proto3";

package bearing.resolver.v1alpha1;

import "bearing/model/v1alpha1/enums.proto";
import "bearing/model/v1alpha1/fact.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bearing.example/gen/go/bearing/resolver/v1alpha1;resolverv1alpha1";

// OrderingKey is the key every write is compared by, left to right:
// (observed_at, observation_id, event_id, content_hash)
// (docs/spec/data-model.md, "Ordering and idempotency"). The strings compare
// by their UTF-8 bytes; pkg/model compares keys.
message OrderingKey {
  // The write's observed_at.
  google.protobuf.Timestamp observed_at = 1;
  // The observation that made the write; for a manual event, the event ID.
  string observation_id = 2;
  // The event that carried it, which includes the source.
  string event_id = 3;
  // Lowercase hex SHA-256 of the JCS form of the observation's data; for a
  // manual event, of the payload.
  string content_hash = 4;
}

// BindingWrite is one observed write to an alias: a binding of the name to
// a subject from valid_from on, or its release.
message BindingWrite {
  // The write's ordering key; for a joined write, that of the last
  // confirmation.
  OrderingKey key = 1;
  // Where the write starts in valid time, extending to infinity. Absent
  // means all valid time (id aliases) or, with tentative, no start.
  google.protobuf.Timestamp valid_from = 2;
  // The subject as written, or empty for a release without a redirect. The
  // store does not look inside a state value, so it can't replace a ref here:
  // an entry for a subject its ChangeSet creates names the subject in its
  // key (docs/spec/contracts.md, "State keys") and leaves this empty.
  string subject_id = 3;
  // The name is released from valid_from on; subject_id, if set, is where
  // it redirects.
  bool released = 4;
  // Written by a reference when minting a placeholder.
  bool tentative = 5;
  // The key of the first confirmation, when the write joins several: the
  // same name bound to the same subject by observations with greater keys.
  // Absent for a write that joins none.
  OrderingKey first_key = 6;
}

// BindingWrites is every write to one alias, in no particular order. The
// binding timeline in the graph is computed from it. It gains a write when a
// sync binds the alias to a subject differently from before.
message BindingWrites {
  // The writes.
  repeated BindingWrite writes = 1;
}

// SupportSegment is one source's state for one fact over one valid-time
// interval, with the key of the write that decided it. A series of segments
// is what remains of all the source's writes about the fact: at each valid
// time the covering write with the greatest key.
message SupportSegment {
  // The deciding write's ordering key; for a segment that joins
  // confirmations, the last one's.
  OrderingKey key = 1;
  // Start of valid time; absent means unbounded.
  google.protobuf.Timestamp valid_from = 2;
  // End of valid time; absent means unbounded.
  google.protobuf.Timestamp valid_to = 3;
  // True if the segment is asserted. An ended segment is kept so an older
  // write applied later can't override it.
  bool live = 4;
  // Ended segments: ASSERT for a claim's own valid_to, END for an absent
  // claim, SNAPSHOT for a scope's watermark, DELETED for entity.deleted,
  // WITHDRAWN for a withdrawn claim.
  bearing.model.v1alpha1.SupportReason reason = 5;
  // Live segments: the version's content, without its interval, fact_id and
  // record times. For a segment that joins confirmations it is the first
  // one's, so the first confirmation's key is the support's own
  // observed_at, observation_id and event_id (without a content hash).
  bearing.model.v1alpha1.Support support = 6;
}

// SupportSegments is one source's segments for one fact, sorted by
// valid_from and not overlapping. A sync that repeats a live segment's state
// extends it: the segment takes the sync's key and end, and keeps the first
// claim's support, whose key is the first confirmation's.
message SupportSegments {
  // The segments.
  repeated SupportSegment segments = 1;
}

// Watermark ends, from valid time `at` on and with `key`, every fact of the
// source in its scope that the observation did not claim, including facts
// whose claims are applied later (docs/spec/data-model.md, "Snapshot
// scopes").
message Watermark {
  // Start of the ending in valid time.
  google.protobuf.Timestamp at = 1;
  // The watermark's ordering key.
  OrderingKey key = 2;
  // SNAPSHOT for a scope, DELETED for entity.deleted.
  bearing.model.v1alpha1.SupportReason reason = 3;
}

// ScopeWatermarks is the watermarks of a scope (source, subject, direction and
// predicate, or the subject's identity evidence in a namespace), sorted by
// `at`. A watermark is dropped once another with an earlier or equal `at` has
// a greater or equal key, so the rest rise together: in order of key they are
// in order of `at`.
//
// The `wm/` entries keep a scope's watermarks apart, so that a sync adds one
// small entry and rewrites none that grows. The entry at the scope's key is
// its head. A head written before issue #136 holds every watermark in
// `watermarks` and has `bucketed` unset; the first sync to change them moves
// them into entries of their own. A bucketed head holds no watermarks: they
// are in the entries at the head's key plus "/" and a bucket number, each a
// ScopeWatermarks that holds, sorted by key, the watermarks whose key's
// observed_at falls in that quarter hour of the epoch (the bucket). A late
// claim finds the first watermark with a greater key by reading its bucket
// and the ones after it up to `last_bucket`, so an entry is only ever read by
// its key. A bucket is written when it gains or loses a watermark.
message ScopeWatermarks {
  // The watermarks, in a head that is not bucketed and in a bucket's entry.
  repeated Watermark watermarks = 1;
  // Set in a head whose watermarks are in buckets' entries.
  bool bucketed = 2;
  // In a bucketed head, the buckets, as quarter hours since the epoch, that
  // can hold a watermark of the scope itself are first_bucket to last_bucket.
  // first_bucket greater than last_bucket says the scope has none.
  int64 first_bucket = 3;
  // See first_bucket.
  int64 last_bucket = 4;
  // In a head, the keys of the heads of the scopes of subjects merged into
  // this one's subject, whose watermarks also apply here. They are left where
  // they are, not copied.
  repeated string linked = 5;
}
