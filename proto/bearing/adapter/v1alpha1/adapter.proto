// The service every adapter serves (ADR 4). The core calls it over gRPC
// (Connect), on a Unix socket for an adapter it starts and over TLS for a
// remote one; the service is the same either way.

syntax = "proto3";

package bearing.adapter.v1alpha1;

import "bearing/event/v1alpha1/event.proto";
import "bearing/model/v1alpha1/enums.proto";
import "bearing/model/v1alpha1/observation.proto";

option go_package = "bearing.example/gen/go/bearing/adapter/v1alpha1;adapterv1alpha1";

// AdapterService reads one kind of source system and reports what it sees
// as observations. Adapters are stateless and read-only against their
// source.
service AdapterService {
  // Describe says what the adapter is, what it emits and what access it
  // needs. The core calls it once after connecting.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Sync reads one page of the source. The core calls it again with the
  // returned cursor until done is set.
  rpc Sync(SyncRequest) returns (SyncResponse);
  // Handle turns one webhook delivery into observations. The core has
  // already checked the delivery's signature. Adapters without webhooks
  // answer with the Unimplemented code.
  rpc Handle(HandleRequest) returns (HandleResponse);
}

// DescribeRequest is empty.
message DescribeRequest {}

// DescribeResponse describes the adapter.
message DescribeResponse {
  // The adapter's name, such as "github".
  string name = 1;
  // The adapter's version, such as "0.3.0".
  string version = 2;
  // The kinds the adapter emits, such as "Repository".
  repeated string emits = 3;
  // A JSON Schema for the adapter's configuration, as JSON; empty if it
  // takes none.
  bytes config_schema = 4;
  // The access the adapter needs in the source, in words, such as
  // "read repository metadata".
  repeated string access = 5;
  // Whether the adapter handles webhooks.
  bool webhooks = 6;
  // How deliveries are signed; set when webhooks is.
  WebhookSignature webhook_signature = 7;
  // The major version of this service the adapter speaks. The adapter
  // library fills it in; the core refuses an adapter whose version it does
  // not support. Absent (0) means 1, the version before this field; once 1
  // is dropped, an adapter that sends nothing is refused.
  uint32 protocol_version = 8;
  // The terms the adapter publishes in its own namespace (ADR 13). Every
  // source that runs the adapter publishes the same module. Absent: the
  // adapter emits today's names, read as core terms.
  VocabularyModule vocabulary = 9;
  // Whether the adapter takes an adapter mapping (ADR 14). Once
  // SourceSpec.adapter_mapping exists (stream O), a Source for such an
  // adapter will have to set it, and a Source for any other adapter will
  // have to leave it unset; boot will refuse either mismatch, naming both.
  // Nothing enforces it yet.
  bool takes_adapter_mapping = 10;
}

// VocabularyModule is the terms one owner publishes in one namespace, at one
// version (ADR 13). A term only grows: a later version may add terms, never
// change or narrow one.
message VocabularyModule {
  // A reverse domain, such as "io.k8s". "com.dougmccall.bearing.core" is the
  // core's; a bare segment such as "k8s" is refused.
  string namespace = 1;
  // The module's version, such as "0.4.0"; observations name it in
  // module_version.
  string version = 2;
  // Where the module came from.
  ModuleSource source = 3;
  // The terms, each named once, without the namespace.
  repeated VocabularyTerm terms = 4;
}

// ModuleSource is where a module came from, so a term row can say so.
message ModuleSource {
  // The repository, such as "https://github.com/acme/vocab".
  string repo = 1;
  // The module's path in the repository.
  string path = 2;
  // The full commit SHA the module was read or built at.
  string commit = 3;
  // The sha256 of the module file, hex; empty when not pinned.
  string sha256 = 4;
}

// VocabularyTerm is one kind, relation or attribute.
message VocabularyTerm {
  // The name within the namespace: "Deployment" for a kind, lowercase
  // letters, digits and "_" for a predicate. Required.
  string name = 1;
  // What the term names. Required.
  bearing.model.v1alpha1.TermType type = 2;
  // An attribute's value type; unset for kinds and relations.
  bearing.model.v1alpha1.ValueType value_type = 3;
  // A predicate's cardinality; unset for kinds.
  bearing.model.v1alpha1.Cardinality cardinality = 4;
  // A predicate's conflict policy; unset for kinds.
  bearing.model.v1alpha1.ConflictPolicy conflict = 5;
  // The kinds a predicate's subject may have, as full or core names. Empty:
  // any kind.
  repeated string domain = 6;
  // The kinds a relation's object may have. Empty: any kind.
  repeated string range = 7;
}

// WebhookSignature says how a source signs its webhook deliveries, so the
// core can check them before the adapter sees them.
message WebhookSignature {
  // The scheme, as a model.v1alpha1.WebhookScheme name, such as
  // "WEBHOOK_SCHEME_HMAC_SHA256".
  string scheme = 1;
  // The header that carries the signature.
  string signature_header = 2;
  // Text before the signature in that header, such as "sha256=".
  string signature_prefix = 3;
}

// SyncRequest asks for one page.
message SyncRequest {
  // The source's adapter configuration, as JSON.
  bytes config = 1;
  // The cursor from the previous page; empty for the first.
  string cursor = 2;
  // Every active kind the adapter declares, from the vocabulary the server
  // booted with (ADR 10), sorted, each once. An adapter may skip work for
  // kinds not listed.
  // Empty means no filter, so a core that doesn't send it is read correctly;
  // a source with no active kinds is never synced.
  repeated string enabled_kinds = 3;
}

// SyncResponse is one page.
message SyncResponse {
  // What the page saw.
  repeated bearing.event.v1alpha1.Observation observations = 1;
  // The cursor for the next page; ignored when done is set.
  string next_cursor = 2;
  // Whether this is the last page.
  bool done = 3;
  // Set on the last page of a sync that listed every entity of these kinds.
  bearing.model.v1alpha1.CompleteSync complete_sync = 4;
}

// HandleRequest is one webhook delivery.
message HandleRequest {
  // The source's adapter configuration, as JSON.
  bytes config = 1;
  // The delivery's HTTP headers.
  map<string, HeaderValues> headers = 2;
  // The delivery's body, as received.
  bytes body = 3;
  // Every active kind the adapter declares, as in SyncRequest.enabled_kinds.
  repeated string enabled_kinds = 4;
}

// HeaderValues are the values of one HTTP header.
message HeaderValues {
  // The values, in the order received.
  repeated string values = 1;
}

// HandleResponse is what the delivery says.
message HandleResponse {
  // What the delivery says.
  repeated bearing.event.v1alpha1.Observation observations = 1;
}
