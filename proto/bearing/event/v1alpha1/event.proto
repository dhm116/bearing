// Events on Bearing's event log: inputs, adapter output and the events the
// core appends itself. Each payload travels as the data of a CloudEvent; the
// observation envelope is spelled out because adapters emit it whole.

syntax = "proto3";

package bearing.event.v1alpha1;

import "bearing/model/v1alpha1/observation.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bearing.example/gen/go/bearing/event/v1alpha1;eventv1alpha1";

// Observation is a CloudEvents 1.0 event carrying one observation, in
// structured mode: its ProtoJSON is the CloudEvents JSON form.
message Observation {
  // CloudEvents spec version: "1.0".
  string specversion = 1;
  // Stable for the same entity and time; part of the ordering key.
  string id = 2;
  // The adapter's own label, e.g. "adapter/github". Not provenance.
  string source = 3;
  // The CloudEvents type: "dev.bearing.observation.v1".
  string type = 4;
  // observed_at of every claim. Truncated to microseconds on ingest.
  google.protobuf.Timestamp time = 5;
  // "application/json".
  string datacontenttype = 6;
  // The configured source whose event carried the observation. Set by the
  // core, never by adapters.
  string bearingsource = 7;
  // The observation. Required.
  bearing.model.v1alpha1.ObservationData data = 8;
}

// SyncRequested asks for a sync of one source. The sync is identified by
// this event's ID, and its time is t0.
message SyncRequested {
  // The configured source to sync.
  string source = 1;
  // Who asked: the scheduler, the CLI or the API.
  Actor actor = 2;
}

// WebhookReceived is one webhook delivery, verified by the host before it
// is logged.
message WebhookReceived {
  // The configured source the delivery is for.
  string source = 1;
  // The request headers as the host stored them: the signature header first,
  // then the others sorted by name (net/http does not keep arrival order),
  // up to 64 headers and 16 KiB, with invalid UTF-8 replaced. Headers that
  // carry credentials (Authorization, Proxy-Authorization, Cookie,
  // Set-Cookie) are never stored. Only the body is covered by the signature,
  // so an adapter must treat every other header as the sender's claim.
  repeated Header headers = 2;
  // The request body, unchanged.
  bytes body = 3;
  // When the host received it.
  google.protobuf.Timestamp received_at = 4;
}

// Header is one HTTP header field.
message Header {
  // The field name as received.
  string name = 1;
  // The field value.
  string value = 2;
}

// ObservationsEmitted is one page of adapter output.
message ObservationsEmitted {
  // The configured source that ran the adapter.
  string source = 1;
  // The SyncRequested or WebhookReceived event this page answers.
  string trigger_event_id = 2;
  // The observations.
  repeated Observation observations = 3;
  // The last page of a sync: done.
  bool done = 4;
  // On the last page, the kinds the sync visited completely.
  bearing.model.v1alpha1.CompleteSync complete_sync = 5;
  // On the last page of a sync, when the sync started by the adapter's clock:
  // the earliest observed_at among all the sync's observations, since the
  // store compares it with observed_at. Unset when the sync observed nothing
  // and on a webhook's page.
  google.protobuf.Timestamp sync_started = 6;
}

// Actor is who asked for an event.
message Actor {
  // What the authenticator proved: "token" for the API token, or
  // "local:<uid>" for the socket's caller, or "system:<name>" for a Bearing
  // component (the scheduler).
  string subject = 1;
  // True for an agent.
  bool agent = 2;
}

// EventDeadLettered is the record of an event a worker gave up on after
// repeated failures, appended to the core/dead_letter partition with Retain
// (it holds no event data) so it outlives the retention window
// (docs/spec/contracts.md, "Dead letters"). The worker reports the event,
// marks it applied and commits past it, so one bad event cannot hold the log.
message EventDeadLettered {
  // The ID of the event that could not be applied.
  string event_id = 1;
  // Its partition.
  string partition = 2;
  // Its offset in that partition.
  int64 offset = 3;
  // Its CloudEvents type.
  string type = 4;
  // Its time.
  google.protobuf.Timestamp event_time = 5;
  // The consumer group that gave up on it.
  string group = 6;
  // How many times the group tried.
  uint32 attempts = 7;
  // The last error, cut to 1,024 bytes of valid UTF-8 with control
  // characters replaced. Source systems and adapters write error text, so it
  // is never trusted to be free of data.
  string error = 8;
  // The size of the event's data in bytes. The data itself is not copied: a
  // webhook's headers and body are organization data and can carry
  // credentials, and this record lives until someone releases it. The event
  // stays in the log until retention removes it, and a sync can be run again.
  uint64 data_bytes = 9;
}
